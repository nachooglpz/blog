baseURL: https://example.invalid/
title: Nacho's Blog
locale: en-AU
defaultContentLanguage: en
theme: no-fate
# copyright: What we make for ourselves
enableRobotsTXT: true

pagination:
  pagerSize: 12

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  topic: topics
  category: categories

menu:
  main:
    - identifier: writing
      name: Writing
      url: /blog/
      weight: 10
      params:
        secondary: ideas, arguments, essays
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
      params:
        secondary: documents, images, histories
    - identifier: about
      name: About
      url: /about/
      weight: 50
      params:
        secondary: biography, contact, policies
    - identifier: search
      name: Search
      url: /search/
      weight: 60

params:
  author: Luis Ignacio
  description: Notes on tools, rituals, records, and the beautiful trouble of doing it ourselves.
  defaultTheme: auto
  disableThemeToggle: false
  disableSpecial1stPost: true
  mainSections:
    - blog
    - questions
    - notes
    - archives
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  hideAuthor: true
  footer:
    hideCopyright: true
    hidePoweredBy: true
    text: "A digital garden curated with <3"
  label:
    text: Nacho's blog
  noFate:
    style: wild
    defaultMode: editorial
    defaultAccent: signal
    showThemeToggle: true
    showSearch: true
    showReadingTime: true
    showPropositions: true
    enableImageProcessing: true
    validateContentModel: true
    strictHomeSelections: true
    wild:
      masthead: "Cool topics in Computer Science"
      issue: "Mexico"
    home:
      featuredProposition: example-maintenance-is-design
    archive:
      showArtefactNumbers: true
      showRights: true
    images:
      widths:
        - 480
        - 800
        - 1200
        - 1600
      webpQuality: 82
    record:
      dataFile: record
      enableClientFilters: true
      selectedGroupBy: collection
      filterFields:
        - year
        - type
        - topic
      highlightCreators:
        - Iona Bramble
      showAbstracts: false

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
        enable: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
    renderer:
      unsafe: false
